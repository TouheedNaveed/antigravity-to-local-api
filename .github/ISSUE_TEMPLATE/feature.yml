name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Describe the idea clearly. Do not include secrets or private config.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like the project to do.
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Alternatives you considered, or links to related issues.
    validations:
      required: false
